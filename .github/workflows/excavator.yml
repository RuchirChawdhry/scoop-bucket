name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Monday and Friday, 03:00 UTC = 08:30 IST
    - cron: '0 3 * * 1,5'

# Only this repository; open a PR instead of pushing to main.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scoop-excavator
  cancel-in-progress: false

jobs:
  update-and-validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod 'https://get.scoop.sh' -OutFile scoop-install.ps1
          ./scoop-install.ps1 -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check, validate and open update pull request
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
          SCOOP_GH_TOKEN: \${{ github.token }}
        run: ./scripts/update.ps1
