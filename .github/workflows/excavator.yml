name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Monday and Friday, 03:00 UTC = 08:30 IST
    - cron: '0 3 * * 1,5'

# Only this repository; open a PR instead of pushing to main.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scoop-excavator
  cancel-in-progress: false

jobs:
  update-and-validate:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Scoop's version-checking scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: .scoop-core
          persist-credentials: false
      - name: Check, validate and open update pull request
        shell: pwsh
        env:
          SCOOP: ${{ runner.temp }}/scoop-root
          SCOOP_CACHE: ${{ runner.temp }}/scoop-cache
          GH_TOKEN: ${{ github.token }}
          SCOOP_GH_TOKEN: ${{ github.token }}
        run: ./scripts/update.ps1
