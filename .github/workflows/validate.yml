name: Validate bucket

on:
  push:
    branches: [main]
    paths:
      - 'bucket/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
  workflow_dispatch:
  # Updates pushed by Excavator's GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: [Excavator]
    types: [completed]

permissions:
  contents: read

jobs:
  manifests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manifests (offline)
        run: python3 -m unittest discover -s tests -v

  electron:
    needs: manifests
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: todoist
            exe: Todoist.exe
          - app: toggl
            exe: Toggl 2.0.exe
          - app: wispr-flow
            exe: payload/lib/net45/Wispr Flow.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod 'https://get.scoop.sh' -OutFile scoop-install.ps1
          ./scoop-install.ps1 -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install, verify extracted executable, uninstall
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          EXPECTED_EXE: ${{ matrix.exe }}
        run: |
          $ErrorActionPreference = 'Stop'
          scoop install 7zip
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install 7zip.' }
          scoop install ".\bucket\$env:APP.json"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install $env:APP." }
          $prefix = (scoop prefix $env:APP | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $prefix)) {
            throw "Missing Scoop install directory for $env:APP."
          }
          $exe = Join-Path $prefix $env:EXPECTED_EXE
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected executable missing: $exe"
          }
          Write-Host "Verified: $exe"
          scoop uninstall $env:APP
          if ($LASTEXITCODE -ne 0) { throw "Failed to uninstall $env:APP." }
